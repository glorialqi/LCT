<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客户订单物流安排总览</title>
<style>
:root{
  --blue:#2f74ff;--blue2:#edf4ff;--green:#20b26c;--orange:#f28a4b;
  --red:#e9564a;--ink:#23344d;--text:#5e6d82;--muted:#8c98a8;
  --line:#e5ebf3;--bg:#f3f6f9;--panel:#fff;--soft:#f8fbfe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
button{font:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d9e3ef;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.app-header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand-mark{width:26px;height:26px;display:grid;place-items:center;color:#fff;background:#283e5d;border-radius:5px;font-size:11px}
.crumb{color:var(--muted)}
.page{padding:12px}

.workbench{display:flex;align-items:stretch;gap:0;margin-top:10px;height:calc(100vh - 200px);min-height:620px;min-width:0}
.workbench > .panel{min-width:0}
.workbench > .col-consignment{flex:1 1 228px;min-width:228px;max-width:340px}
.workbench > .col-task{flex:1.4 1 322px;min-width:300px;max-width:520px}
.workbench > .col-route{flex:2.4 1 640px;min-width:320px}
.workbench > .col-detail{flex:1 1 306px;min-width:286px;max-width:420px}
.vsplit{flex:0 0 10px;position:relative;cursor:col-resize}
.vsplit::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:40px;width:3px;border-radius:2px;background:#e2eaf4;transition:.15s}
.vsplit:hover::after,.vsplit.dragging::after{background:#bcd3f7;height:60px}
body.resizing-x{cursor:col-resize;user-select:none}
.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}

.panel-head{height:47px;flex:0 0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:#fff}
.panel-title{font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.panel-title::before{content:"";width:3px;height:15px;background:var(--blue);border-radius:2px}
.count{color:var(--muted);font-size:11px;font-weight:400}
.panel-body{padding:10px;overflow:auto;min-height:0;flex:1}
.sub-filter{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);overflow:auto;flex:0 0 auto}
.filter{border:0;background:#f4f7fb;color:#6e7e93;border-radius:12px;padding:4px 9px;font-size:10px;white-space:nowrap}
.filter.active{background:var(--blue);color:#fff}
.consignment{position:relative;border:1px solid #e7edf4;border-radius:8px;margin-bottom:8px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s,background .15s}
.consignment::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#dce6f5;transition:background .15s}
.consignment.running::before{background:var(--blue)}
.consignment.pending::before{background:#f4ae78}
.consignment.done::before{background:var(--green)}
.consignment.exceptional::before{background:var(--red)}
.consignment:hover{border-color:#b9d2ff;box-shadow:0 4px 14px rgba(47,116,255,.08)}
.consignment.active{border-color:#7da8ff;background:#f7fbff;box-shadow:0 0 0 2px rgba(47,116,255,.09)}
.consignment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.consignment-name{font-weight:700;color:#32455e;font-size:12px;line-height:1.4;word-break:break-all}
.consignment-version{margin-top:5px;font-size:10px;color:#8592a6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.consignment-info{margin-top:9px;padding-top:8px;border-top:1px dashed #eaeff6;display:grid;gap:5px;font-size:10px;color:#5e6f85}
.consignment-info div{display:flex;gap:6px;min-width:0}
.consignment-info label{color:#98a4b4;flex:0 0 auto}
.consignment-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.consignment-main{padding:11px 12px 0 14px;cursor:pointer}
.consignment-toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:9px 0;border:0;border-top:1px dashed #eaeff6;background:transparent;color:var(--blue);font-size:10px}
.consignment-toggle:hover{color:#1f5ee0}
.consignment-toggle i{width:6px;height:6px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s}
.consignment-toggle i.up{transform:rotate(-135deg) translate(-2px,-2px)}
.consignment-more{display:none;padding:10px 12px 11px 14px;border-top:1px solid #eaf0f7;background:#f8fbff}
.consignment.open .consignment-more{display:block}
.cm-grid{display:grid;gap:8px}
.cm-grid > div{display:flex;gap:8px;align-items:baseline}
.cm-grid label{color:#98a4b4;font-size:9px;flex:0 0 70px}
.cm-grid span{color:#4e6078;font-size:10px;word-break:break-all;line-height:1.5}
.cm-attach{margin-top:10px;padding-top:9px;border-top:1px dashed #dce7f5;display:flex;align-items:center;justify-content:space-between}
.cm-attach > span{color:#7b899c;font-size:10px}
.cm-attach button{color:#2f74ff;background:#edf4ff;border:1px solid #cadcff;border-radius:4px;padding:4px 8px;font-size:10px}
.cm-files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.status{flex:0 0 auto;padding:2px 7px;border-radius:10px;font-size:9px;white-space:nowrap}
.status.running{color:#3478f3;background:#eaf2ff}
.status.done{color:#20a76a;background:#e6f9ef}
.status.pending{color:#dc7a43;background:#fff0e7}
.status.exception{color:#df5347;background:#ffebe9}
.task-card{border:1px solid #e7edf4;border-left:3px solid #dce6f5;border-radius:6px;padding:10px;margin-bottom:8px;background:#fff;cursor:pointer}
.task-card:hover{background:#fbfdff}
.task-card.active{border-color:#7da8ff;border-left-color:var(--blue);box-shadow:0 3px 12px rgba(47,116,255,.1)}
.task-card.running{border-left-color:var(--blue)}
.task-card.pending{border-left-color:#f4ae78}
.task-card.done{border-left-color:var(--green)}
.task-head{display:flex;align-items:center;gap:8px}
.task-id{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-mode{flex:0 0 auto;font-size:10px;color:#8b98a9;white-space:nowrap}
.task-id{font-weight:700;color:#344860;font-size:11px}
.task-route{display:flex;align-items:center;gap:5px;margin-top:8px;color:#5b6d83;font-size:10px}
.route-dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.route-dot.end{background:var(--orange)}
.route-line{height:1px;min-width:16px;flex:1;background:#d9e3f2}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:3px;background:#f1f5fa;color:#61728a;font-size:9px}
.product-dot{width:6px;height:6px;border-radius:50%}
.task-progress{height:4px;background:#e8eef7;border-radius:4px;margin-top:9px;overflow:hidden}
.task-progress span{display:block;height:100%;border-radius:4px;background:var(--blue)}
.task-foot{display:flex;justify-content:space-between;color:#8b98a9;font-size:9px;margin-top:5px}
.task-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:9px;padding-top:9px;border-top:1px dashed #eaeff6}
.task-fields > div{min-width:0;display:flex;gap:6px;align-items:baseline}
.task-fields label{color:#98a4b4;font-size:9px;flex:0 0 auto}
.task-fields b{font-weight:400;color:#4d6078;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route-flow{margin-top:9px;padding-top:9px;border-top:1px dashed #eaeff6}
.rf-node{position:relative;display:flex;gap:9px;padding-bottom:9px}
.rf-node:last-child{padding-bottom:0}
.rf-node::before{content:"";position:absolute;left:4px;top:13px;bottom:-1px;width:1px;background:#dbe5f2}
.rf-node:last-child::before{display:none}
.rf-dot{position:relative;z-index:1;flex:0 0 auto;width:9px;height:9px;margin-top:4px;border-radius:50%;background:#fff;border:2px solid #f28a4b}
.rf-node.origin .rf-dot{border-color:var(--blue)}
.rf-body{flex:1;min-width:0}
.rf-line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.rf-port{min-width:0;max-width:100%;font-size:11px;font-weight:600;color:#3f536d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf-label{flex:0 0 auto;font-style:normal;font-size:9px;color:#9aa6b5;white-space:nowrap}
.rf-time{flex:0 0 auto;font-size:10px;color:#8b98a9;white-space:nowrap}
.cargo-block{margin-top:9px;padding-top:9px;border-top:1px dashed #eaeff6}
.cargo-title{color:#8b98a9;font-size:9px;margin-bottom:7px}
.cargo-list{display:grid;gap:4px}
.cargo-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:5px 9px;border:1px solid #eef3f9;border-radius:5px;background:#fbfdff}
.cr-name{display:inline-flex;align-items:center;gap:5px;flex:1 1 auto;min-width:0;font-size:11px;font-weight:600;color:#3f536d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-name i{flex:0 0 auto;width:6px;height:6px;border-radius:50%}
.cr-qty{flex:0 0 auto;font-size:11px;font-weight:700;color:#2b3f59;font-variant-numeric:tabular-nums;white-space:nowrap}
.cr-qty em{margin-left:1px;font-style:normal;font-size:9px;font-weight:400;color:#8b98a9}
.cr-stats{display:flex;flex-wrap:wrap;gap:2px 12px;margin-left:auto}
.cr-stats span{display:inline-flex;align-items:baseline;gap:3px}
.cr-stats em{font-style:normal;font-size:9px;color:#9aa6b5;white-space:nowrap}
.cr-stats b{font-size:10px;color:#41556f;font-variant-numeric:tabular-nums}
.task-tabs{padding:0 10px}
.task-tabs .detail-tab{flex:1;padding:10px 6px}
.panel-body[hidden],.sub-filter[hidden]{display:none}
.cost-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 11px;background:#f8fbff;border:1px solid #e5eefb;border-radius:7px;margin-bottom:9px}
.cost-summary .cs-cell{display:inline-flex;align-items:baseline;gap:5px}
.cost-summary .cs-cell em{font-style:normal;color:#9aa6b5;font-size:9px}
.cost-summary .cs-cell b{font-size:13px;font-weight:700;color:#2b3f59;font-variant-numeric:tabular-nums}
.cost-summary .cs-cell.act b{color:#20a76a}
.cost-summary .cs-count{margin-left:auto;color:#9aa6b5;font-size:9px;white-space:nowrap}
.cost-card{border:1px solid #e7edf4;border-left:3px solid #dce6f5;border-radius:6px;padding:9px 10px;margin-bottom:8px;background:#fff;cursor:pointer;transition:.15s}
.cost-card:hover{background:#fbfdff}
.cost-card.active{border-color:#7da8ff;border-left-color:var(--blue);box-shadow:0 3px 12px rgba(47,116,255,.1)}
.cost-card.running{border-left-color:var(--blue)}
.cost-card.pending{border-left-color:#f4ae78}
.cost-card.done{border-left-color:var(--green)}
.cost-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cost-task{font-weight:700;color:#344860;font-size:11px;word-break:break-all}
.cost-totals{display:flex;gap:16px;margin-top:7px;padding:6px 8px;background:#f7faff;border-radius:5px}
.cost-totals span{display:inline-flex;align-items:baseline;gap:5px;min-width:0}
.cost-totals em{font-style:normal;color:#9aa6b5;font-size:9px;white-space:nowrap}
.cost-totals b{font-size:12px;font-weight:700;color:#2b3f59;font-variant-numeric:tabular-nums}
.cost-totals b.zero{color:#a8b3c2;font-weight:400}
.cost-lines{margin-top:8px;padding-top:7px;border-top:1px dashed #eef2f8;display:grid;gap:5px}
.cost-line{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:baseline;font-size:10px;color:#6b7c92}
.cost-line>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost-line b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost-line b.est{color:#41556f}
.cost-line b.act{color:#20a76a}
.cost-line b.act.zero{color:#a8b3c2}
.cost-line-head{color:#9aa6b5;font-size:9px}
.cost-line-head b{color:#9aa6b5;font-weight:400}
.cost-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.cost-foot small{color:#9aa6b5;font-size:9px}
.cost-empty{padding:30px 12px;text-align:center;color:#95a2b4;font-size:11px}
.view-head{display:flex;align-items:center;gap:5px}
.view-tab{border:1px solid #dfe7f2;background:#fff;color:#687a90;border-radius:4px;padding:4px 9px;font-size:10px;white-space:nowrap}
.view-tab.active{color:#fff;border-color:var(--blue);background:var(--blue)}
.route-tools{flex:0 0 auto;padding:7px 10px;border-bottom:1px solid var(--line);background:#fcfdff;display:grid;gap:7px}
.chip-row{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #e2eaf4;background:#fff;color:#65778e;border-radius:12px;padding:3px 9px;font-size:10px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:#bcd3f7;color:#3f70d2}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chip[hidden]{display:none}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tool-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tool-row .spacer{flex:1}
.tool-btn{border:1px solid #e2eaf4;background:#fff;color:#5f7288;border-radius:4px;padding:4px 8px;font-size:10px;line-height:1.3;transition:.15s}
.tool-btn:hover{border-color:#bcd3f7;color:var(--blue);background:#f7faff}
.tool-btn.icon{width:25px;padding:4px 0;text-align:center;font-size:13px}
.tool-btn[disabled]{opacity:.45;cursor:not-allowed}
.zoom-label{min-width:40px;text-align:center;color:#6c7d93;font-size:10px;font-variant-numeric:tabular-nums}
.route-body{padding:0;overflow:hidden;display:flex;flex-direction:column}
.stage-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#f8fbff,#edf4fb);cursor:grab;touch-action:none}
.stage-wrap.dragging{cursor:grabbing}
.stage-wrap.map-mode{background:#e8eff7}
.stage-wrap.map-mode::before{display:none}
.stage-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(99,126,164,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(99,126,164,.055) 1px,transparent 1px);background-size:36px 36px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map-layer{position:relative}
.map-canvas{position:relative;background-color:#e8eff7;background-image:linear-gradient(rgba(99,126,164,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(99,126,164,.07) 1px,transparent 1px);background-size:36px 36px}
.map-tiles{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:transparent}
.map-tile{position:absolute;display:block;width:256px;height:256px;pointer-events:none;user-select:none}
.map-svg{position:absolute;left:0;top:0;overflow:visible}
.route-path{fill:none;stroke:#3c83ff;stroke-width:4;stroke-linecap:round;transition:opacity .2s,stroke-width .2s}
.route-path.pending{stroke:#f2a568}
.route-path.done{stroke:#20b26c}
.map-point{stroke:#fff;stroke-width:3;transition:opacity .2s}
.map-point.start{fill:#2f74ff}
.map-point{r:5px}
.map-point.end{fill:#f28a4b}
.city-label{fill:#33475f;font-size:11px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.map-legend[hidden]{display:none}
.map-legend{position:absolute;left:14px;bottom:14px;z-index:2;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:8px 11px;color:#708097;font-size:10px;box-shadow:0 4px 14px rgba(60,95,150,.08)}
.flow-layer{position:relative}
.flow-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.flow-link{fill:none;stroke-width:2.4;stroke-linecap:round;transition:opacity .2s,stroke-width .2s}
.flow-link.hot{stroke-width:3.4;stroke-dasharray:8 8;animation:flowDash .85s linear infinite}
@keyframes flowDash{to{stroke-dashoffset:-32}}
.flow-node{position:absolute;width:180px;min-height:112px;padding:9px 10px;border:1px solid #dfe8f5;border-radius:8px;background:#fff;box-shadow:0 5px 16px rgba(65,102,155,.09);cursor:pointer;transition:opacity .2s,box-shadow .2s,border-color .2s,transform .2s}
.flow-node:hover{border-color:#b9d2ff;box-shadow:0 8px 20px rgba(65,102,155,.15)}
.flow-node.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,116,255,.12),0 8px 20px rgba(47,116,255,.16)}
.flow-node.dim{opacity:.24}
.flow-node.ghost{opacity:.5;border-style:dashed}
.fn-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.fn-id{font-weight:700;color:#33475f;font-size:11px;line-height:1.35;word-break:break-all}
.fn-route{margin-top:7px;display:flex;align-items:center;gap:5px;color:#5c6f86;font-size:10px;min-width:0}
.fn-route .fn-city{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56px}
.fn-route i{width:6px;height:6px;border-radius:50%;background:#2f74ff;flex:0 0 auto}
.fn-route i.end{background:#f28a4b}
.fn-route s{flex:1;height:1px;min-width:10px;background:#dbe5f2;text-decoration:none}
.fn-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.fn-progress{margin-top:8px}
.fn-bar{height:4px;border-radius:3px;background:#e8eef7;overflow:hidden}
.fn-bar span{display:block;height:100%;border-radius:3px}
.fn-foot{margin-top:5px;display:flex;justify-content:space-between;gap:8px;color:#8b98a9;font-size:9px}
.fn-foot b{font-weight:700;color:#5c6f86}
.fn-foot b.over{color:var(--red)}
.route-hint{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 10px;color:#93a1b3;font-size:9px;display:flex;justify-content:space-between;gap:10px;background:#fff}
.route-hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:transparent;color:var(--blue);padding:0 2px;font-size:11px}
.detail-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px;flex:0 0 auto}
.detail-tab{border:0;background:transparent;padding:11px 8px;color:#738298;font-size:11px;border-bottom:2px solid transparent}
.detail-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.detail-body{padding:12px;overflow:auto}
.detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.detail-title h3{margin:0;font-size:13px}
.detail-route{margin-top:10px;padding:9px;border-radius:5px;background:#f6f9fd;color:#53667f;font-size:10px}
.field-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.field label{display:block;color:#98a4b4;font-size:9px}
.field div{margin-top:2px;color:#4d6078;font-size:10px;word-break:break-all}
.timeline{margin-top:14px}
.feedback{position:relative;padding:0 0 16px 23px}
.feedback:before{content:"";position:absolute;left:5px;top:5px;bottom:-2px;width:1px;background:#dce5f1}
.feedback:last-child:before{display:none}
.feedback-dot{position:absolute;left:0;top:3px;width:11px;height:11px;border:2px solid #b7c5d8;border-radius:50%;background:#fff}
.feedback.done .feedback-dot{border-color:var(--blue);background:var(--blue)}
.feedback.now .feedback-dot{border-color:var(--blue);box-shadow:0 0 0 3px #e8f1ff}
.feedback-head{display:flex;justify-content:space-between;gap:8px;color:#3f536d;font-weight:700;font-size:10px}
.feedback-time{color:#9aa6b5;font-weight:400;white-space:nowrap}
.feedback-desc{margin-top:4px;color:#718096;font-size:10px}
.detail-actions{display:flex;gap:6px;margin-top:14px;padding-top:11px;border-top:1px dashed #e1e9f4}
.detail-actions a,.detail-actions button{flex:1;text-align:center;border:1px solid #cadcff;background:#edf4ff;color:#2f74ff;border-radius:5px;padding:7px 6px;font-size:10px}
.detail-actions .ghost{border-color:#e2eaf4;background:#fff;color:#65778e}

/* ============ 流向布局 ============ */
function flowLayout(list){
  const byId={};list.forEach(t=>byId[t.id]=t);
  const depth={};
  const walk=(t,stack)=>{
    if(depth[t.id]!=null)return depth[t.id];
    if(stack.has(t.id))return 0;
    stack.add(t.id);
    const srcs=(t.sourceIds||[]).filter(id=>byId[id]);
    const d=srcs.length?Math.max(...srcs.map(id=>walk(byId[id],new Set(stack))))+1:0;
    stack.delete(t.id);
    depth[t.id]=d;return d;
  };
  list.forEach(t=>walk(t,new Set()));
  const cols={};
  list.forEach(t=>{const d=depth[t.id]||0;(cols[d]=cols[d]||[]).push(t)});
  const keys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const W=180,H=112,GX=66,GY=34,PAD=28;
  const rows=Math.max(...keys.map(d=>cols[d].length));
  const canvasH=rows*(H+GY)-GY+PAD*2;
  const pos={};
  keys.forEach(d=>{
    const col=cols[d],totalH=col.length*(H+GY)-GY,startY=(canvasH-totalH)/2;
    col.forEach((t,i)=>{pos[t.id]={x:PAD+d*(W+GX),y:startY+i*(H+GY)}});
  });
  // 重心微调：任务尽量贴近前后序任务所在行，保持同列顺序且不出画布
  keys.forEach(d=>{
    const col=cols[d];
    col.forEach(t=>{
      const nb=[];
      (t.sourceIds||[]).forEach(id=>{if(pos[id])nb.push(pos[id].y)});
      list.forEach(o=>{if((o.sourceIds||[]).includes(t.id)&&pos[o.id])nb.push(pos[o.id].y)});
      t._ty=nb.length?nb.reduce((a,b)=>a+b,0)/nb.length:null;
    });
    let prev=PAD-(H+GY);
    col.forEach((t,i)=>{
      const lo=prev+(H+GY),hi=canvasH-PAD-H-(col.length-1-i)*(H+GY);
      let y=(t._ty!=null)?t._ty:pos[t.id].y;
      y=Math.max(lo,Math.min(hi,y));
      pos[t.id].y=y;prev=y;t._ty=null;
    });
  });
  const canvasW=PAD*2+keys.length*W+(keys.length-1)*GX;
  return {pos,W,H,canvasW,canvasH};
}

    return;
  }

  flowLayer.style.width=L.canvasW+"px";
  flowLayer.style.height=L.canvasH+"px";
  const byId={};list.forEach(t=>byId[t.id]=t);
  const links=[];

    const src=byId[id];if(!src)return;

  }));
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("class","flow-links");
  svg.setAttribute("width",L.canvasW);svg.setAttribute("height",L.canvasH);
  const defs=document.createElementNS(ns,"defs");
  links.forEach((l,i)=>{
    const g=document.createElementNS(ns,"linearGradient");

    g.setAttribute("x1",l.x1);g.setAttribute("y1",l.y1);g.setAttribute("x2",l.x2);g.setAttribute("y2",l.y2);

      g.appendChild(st);
    });
    defs.appendChild(g);
  });
  svg.appendChild(defs);
  links.forEach((l,i)=>{
    const p=document.createElementNS(ns,"path");
    p.setAttribute("class","flow-link");p.setAttribute("d",l.d);p.setAttribute("stroke","url(#lg"+i+")");
    p.dataset.from=l.from;p.dataset.to=l.to;
    p.style.opacity=matchProduct(byId[l.to])?1:.2;
    svg.appendChild(p);
  });
  flowLayer.appendChild(svg);

  list.forEach(t=>{
    const p=pos[t.id],sp=signPct(t);
    const dim=!matchProduct(t);
    const ghost=!!state.consignmentId&&state.scope==="all"&&t.cid!==state.consignmentId;
    const node=document.createElement("div");
    node.className="flow-node"+(t.id===state.taskId?" active":"")+(dim?" dim":"")+(ghost?" ghost":"");
    node.style.left=p.x+"px";node.style.top=p.y+"px";
    node.dataset.tid=t.id;
    node.innerHTML=`
      <div class="fn-head"><span class="fn-id">${esc(t.name)}</span><span class="status ${t.status}">${esc(t.statusText)}</span></div>

/* ============ 渲染：地图（Web Mercator + 瓦片底图） ============ */
const PORTS={
  "泉州":[24.87,118.68],"厦门港":[24.48,118.10],"天津港":[38.98,117.72],"北京仓":[39.90,116.40],
  "福清":[25.72,119.38],"上海港":[31.23,121.50],"漳州":[24.51,117.65],"宁波仓":[29.87,121.55],"日照港":[35.42,119.55]
};
const MAP_ZOOM=6;
const MAP_EXTENT={lonW:106,lonE:126,latS:23.5,latN:41.5};
function mercator(lat,lon,z){
  const scale=256*Math.pow(2,z);
  const x=(lon+180)/360*scale;
  const s=Math.max(-0.9999,Math.min(0.9999,Math.sin(lat*Math.PI/180)));
  const y=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*scale;
  return [x,y];
}
const MAP_ORIGIN=mercator(MAP_EXTENT.latN,MAP_EXTENT.lonW,MAP_ZOOM);
const MAP_END=mercator(MAP_EXTENT.latS,MAP_EXTENT.lonE,MAP_ZOOM);
const MAP_SIZE={w:Math.round(MAP_END[0]-MAP_ORIGIN[0]),h:Math.round(MAP_END[1]-MAP_ORIGIN[1])};
function mapXY(lat,lon){
  const p=mercator(lat,lon,MAP_ZOOM);
  return [p[0]-MAP_ORIGIN[0],p[1]-MAP_ORIGIN[1]];
}
function portLL(name){
  if(!name)return null;
  const key=String(name).replace(/[（(].*?[)）]/g,"").trim();
  return PORTS[key]||null;
}
function routeChain(t){
  return [t.from].concat((t.legs||[]).map(l=>l.port)).filter(Boolean);
}
let mapTilesBuilt=false;
function buildMapTiles(){
  if(mapTilesBuilt)return;
  mapTilesBuilt=true;
  const x0=Math.floor(MAP_ORIGIN[0]/256),x1=Math.floor((MAP_ORIGIN[0]+MAP_SIZE.w)/256);
  const y0=Math.floor(MAP_ORIGIN[1]/256),y1=Math.floor((MAP_ORIGIN[1]+MAP_SIZE.h)/256);
  const out=[];
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const left=Math.round(tx*256-MAP_ORIGIN[0]),top=Math.round(ty*256-MAP_ORIGIN[1]);
      const sub=(tx+ty)%4+1;
      out.push('<img class="map-tile" alt="" style="left:'+left+'px;top:'+top+'px" src="https://webrd0'+sub+'.is.autonavi.com/appmaptile?lang=zh_cn&amp;size=1&amp;scale=1&amp;style=8&amp;x='+tx+'&amp;y='+ty+'&amp;z='+MAP_ZOOM+'" onerror="this.style.display=\'none\'">');
    }
  }
  $("mapTiles").innerHTML=out.join("");
}
function renderMap(){
  buildMapTiles();
  const canvas=$("mapCanvas"),svg=$("mapSvg");
  canvas.style.width=MAP_SIZE.w+"px";
  canvas.style.height=MAP_SIZE.h+"px";
  svg.setAttribute("width",MAP_SIZE.w);
  svg.setAttribute("height",MAP_SIZE.h);
  svg.setAttribute("viewBox","0 0 "+MAP_SIZE.w+" "+MAP_SIZE.h);
  const scope=new Set(routeTasks().map(t=>t.id));
  const shapes=[],labels=[],seen={};
  tasks.forEach(t=>{
    const chain=routeChain(t);
    const pts=[];
    let ok=true;
    chain.forEach(n=>{
      const ll=portLL(n);
      if(!ll){ok=false;return;}
      pts.push(mapXY(ll[0],ll[1]));
    });
    if(!ok||pts.length<2)return;
    const inScope=scope.has(t.id);
    let op=inScope?taskOpacity(t):.05;
    if(inScope&&t.id===state.taskId)op=1;
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    shapes.push('<path class="route-path'+(t.status==="running"?"":" "+t.status)+'" data-task="'+t.id+'" d="'+d+'" style="opacity:'+op.toFixed(3)+'" stroke-width="'+(inScope&&t.id===state.taskId?5:3)+'"></path>');
    pts.forEach((p,i)=>{
      shapes.push('<circle class="map-point '+(i===0?"start":"end")+'" data-task="'+t.id+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===0?5.5:5)+'" style="opacity:'+op.toFixed(3)+'"></circle>');
    });
    chain.forEach(n=>{
      if(seen[n])return;seen[n]=1;
      const ll=portLL(n);if(!ll)return;
      const p=mapXY(ll[0],ll[1]);
      labels.push('<text class="city-label" x="'+(p[0]+8).toFixed(1)+'" y="'+(p[1]+3.5).toFixed(1)+'">'+esc(n)+'</text>');
    });
  });
  svg.innerHTML=shapes.join("")+labels.join("");
}
/* ============ 渲染：任务反馈 ============ */
function taskDate(t){
  const m=String(t.latest||"").match(/^(\d{2})-(\d{2})/);
  return m?("2026-"+m[1]+"-"+m[2]):null;
}
function fbMetaRows(t){
  const c=CARRIERS[t.id]||{};
  if(t.transportType==="水运"&&t.loadType==="散货"){
    return [{tag:"船",items:[["船名",c.ship],["航次",c.voyage],["ETD",c.etd],["ETA",c.eta]]}];
  }
  if(t.transportType==="水运"){
    return [
      {tag:"箱",items:[["箱型",c.ctnType],["箱号",c.ctnNo],["数量",c.ctnCount]]},
      {tag:"船",items:[["船东",c.owner],["船名",c.ship],["航次",c.voyage],["订舱单号",c.booking]]}
    ];
  }
  return [{tag:"车",items:[["车牌",c.vehicle],["司机",c.driver],["电话",c.phone]]}];
}
function fbMetaHtml(t){
  return fbMetaRows(t).map(r=>
    `<span class="fb-mrow"><i class="fb-tag">${esc(r.tag)}</i>`+
    r.items.map(p=>`<span class="kv"><em>${esc(p[0])}</em>${esc(p[1]||"—")}</span>`).join("")+
    `</span>`
  ).join("");
}
function fbList(){
  const q=(state.fbQuery||"").trim().toLowerCase();
  return tasksOf(state.consignmentId).filter(t=>{
    if(state.fbTab==="road"&&t.transportType!=="汽运")return false;
    if(state.fbTab==="seaShip"&&!(t.transportType==="水运"&&t.loadType==="散货"))return false;
    if(state.fbTab==="seaBox"&&!(t.transportType==="水运"&&t.loadType==="集装箱"))return false;
    const d=taskDate(t);
    if(state.fbFrom&&(!d||d<state.fbFrom))return false;
    if(state.fbTo&&(!d||d>state.fbTo))return false;
    if(q){
      const car=CARRIERS[t.id]||{};
      const hay=[t.name].concat(Object.keys(car).map(k=>car[k])).join(" ").toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}
function renderFeedback(){
  const list=fbList();
  $("feedbackCount").textContent=`（${list.length}）`;
  if(!list.length){feedbackList.innerHTML='<div class="empty">暂无符合条件的任务反馈</div>';return;}
  feedbackList.innerHTML=list.map(t=>{
    const steps=t.feedbacks||[];

    return `
    <article class="fb-card ${t.status} ${t.id===state.taskId?"active":""}" data-tid="${t.id}">
      <div class="fb-head">

        <a class="fb-link" href="任务跟踪.html?task=${encodeURIComponent(t.name)}">跟踪 ›</a>
      </div>
      <div class="fb-meta">${fbMetaHtml(t)}</div>
      <div class="fb-steps">${steps.map(f=>{
        const done=!!f.time&&!f.time.startsWith("预计");
        let cls=done?"done":"";
        if(!done&&!nowSet&&(t.status==="running"||t.status==="exception")){cls="now";nowSet=true;}
        return `<div class="fb-step ${cls}" title="${esc(f.name)} · ${esc(f.time||"未反馈")}"><i></i><em>${esc(f.name)}</em></div>`;
      }).join("")}</div>

        <span>最近反馈 ${esc(t.latest)}</span>
      </div>
    </article>`;}).join("");
}
/* ============ 画布：缩放 / 平移 / 适配 ============ */
function contentSize(){
  if(state.view==="map")return {w:MAP_SIZE.w,h:MAP_SIZE.h};
  return {w:parseFloat(flowLayer.style.width)||900,h:parseFloat(flowLayer.style.height)||520};
}
function applyTransform(){
  stage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  zoomLabel.textContent=Math.round(state.zoom*100)+"%";
}
function fitStage(){
  const r=stageWrap.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const c=contentSize();
  const z=clamp(Math.min((r.width-28)/c.w,(r.height-28)/c.h),.15,2);
  state.zoom=z;
  state.panX=(r.width-c.w*z)/2;
  state.panY=(r.height-c.h*z)/2;
  applyTransform();
}
function zoomAt(cx,cy,f){
  const z0=state.zoom,z1=clamp(z0*f,.15,3);
  if(Math.abs(z1-z0)<1e-4)return;
  state.panX=cx-(cx-state.panX)*(z1/z0);
  state.panY=cy-(cy-state.panY)*(z1/z0);
  state.zoom=z1;applyTransform();
}

  renderDemands();

  requestAnimationFrame(()=>{
    pendingFit=true;
    renderAll();
    requestAnimationFrame(fitStage);
  });
}
function closeDrawer(){
  drawerEl.classList.remove("show");
  drawerEl.setAttribute("aria-hidden","true");
  maskEl.classList.remove("show");
  document.body.classList.remove("locked");
}

$("demandList").addEventListener("click",e=>{
  const row=e.target.closest("[data-demand]");
  if(!row)return;
  const d=DEMANDS.find(x=>x.no===row.dataset.demand);
  if(d)openDrawer(d);
});
document.querySelectorAll("[data-demand-filter]").forEach(b=>b.addEventListener("click",()=>{
  state.demandFilter=b.dataset.demandFilter;
  document.querySelectorAll("[data-demand-filter]").forEach(x=>x.classList.toggle("active",x===b));
  renderDemands();
}));
$("drawerClose").addEventListener("click",closeDrawer);
$("drawerMask").addEventListener("click",closeDrawer);
$("drawerRefresh").addEventListener("click",refreshData);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&drawerEl.classList.contains("show"))closeDrawer();
});


/* ============ 抽屉最大化 ============ */
const drawerMaxBtn=$("drawerMax");
function syncMaxBtn(){drawerMaxBtn.textContent=drawerEl.classList.contains("max")?"⤢ 还原":"⤢ 最大化";}
drawerMaxBtn.addEventListener("click",()=>{
  drawerEl.classList.toggle("max");
  syncMaxBtn();
  setTimeout(fitStage,60);
});

/* ============ 四列宽度拖拽 ============ */
const COL_SEL={consignment:".col-consignment",task:".col-task",detail:".col-detail"};
const COL_LIMIT={consignment:[228,440],task:[300,620],detail:[286,520]};
const ROUTE_MIN=320;
let colW=null,vsDrag=null;

function colEl(k){return document.querySelector(COL_SEL[k]);}
function applyColW(reset){
  Object.keys(COL_SEL).forEach(k=>{
    const el=colEl(k);if(!el)return;
    el.style.flexBasis=(reset||!colW)?"":(colW[k]+"px");
  });
}
function workbenchWidth(){const wb=document.querySelector(".workbench");return wb?wb.getBoundingClientRect().width:0;}

document.querySelectorAll(".vsplit").forEach(sp=>{
  sp.addEventListener("pointerdown",e=>{
    if(!colW){
      colW={};
      Object.keys(COL_SEL).forEach(k=>{colW[k]=Math.round(colEl(k).getBoundingClientRect().width);});
    }
    vsDrag={id:e.pointerId,x:e.clientX,left:sp.dataset.left,right:sp.dataset.right,base:{...colW},wb:workbenchWidth()};
    sp.classList.add("dragging");
    try{sp.setPointerCapture(e.pointerId);}catch(_){}
    document.body.classList.add("resizing-x");
    e.preventDefault();
  });
  sp.addEventListener("pointermove",e=>{
    if(!vsDrag||e.pointerId!==vsDrag.id)return;
    const dx=e.clientX-vsDrag.x;
    const next={...vsDrag.base};
    if(vsDrag.left){const lim=COL_LIMIT[vsDrag.left];next[vsDrag.left]=clamp(vsDrag.base[vsDrag.left]+dx,lim[0],lim[1]);}
    if(vsDrag.right){const lim=COL_LIMIT[vsDrag.right];next[vsDrag.right]=clamp(vsDrag.base[vsDrag.right]-dx,lim[0],lim[1]);}
    if(next.consignment+next.task+next.detail>vsDrag.wb-30-ROUTE_MIN)return;
    colW=next;applyColW();fitStage();
  });
  sp.addEventListener("dblclick",()=>{colW=null;applyColW(true);fitStage();});
});
function endVsDrag(e){
  if(!vsDrag||(e&&e.pointerId!==vsDrag.id))return;
  vsDrag=null;
  document.querySelectorAll(".vsplit.dragging").forEach(x=>x.classList.remove("dragging"));
  document.body.classList.remove("resizing-x");
}
document.querySelectorAll(".vsplit").forEach(sp=>{
  sp.addEventListener("pointerup",endVsDrag);
  sp.addEventListener("pointercancel",endVsDrag);
});
window.addEventListener("resize",()=>{
  if(!colW)return;
  const budget=workbenchWidth()-30-ROUTE_MIN;
  const sum=colW.consignment+colW.task+colW.detail;
  if(sum>budget&&sum>0){
    const k=budget/sum;
    colW={consignment:Math.round(colW.consignment*k),task:Math.round(colW.task*k),detail:Math.round(colW.detail*k)};
    applyColW();
  }
});
/* ============ 初始化 ============ */
renderProductFilter();
renderDemands();
$("routeStamp").textContent="更新于 "+stamp();
function bootDrawer(){setTimeout(()=>openDrawer(DEMANDS[0]),380);}
if(document.readyState==="complete")bootDrawer();
else window.addEventListener("load",bootDrawer);
</script>
