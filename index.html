<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>物流控制塔</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-logo" viewBox="0 0 24 24">
      <path d="m12 2.7 8 4.2v9.8l-8 4.6-8-4.6V6.9l8-4.2Z"/>
      <path d="m4.4 7 7.6 4 7.6-4M12 11v9.7M8.3 5l7.7 4.1"/>
    </symbol>
    <symbol id="icon-oms-logo" viewBox="0 0 24 24">
      <path d="M4 9.5 12 5l8 4.5v8L12 22l-8-4.5z"/>
      <path d="m4 9.5 8 4.5 8-4.5M12 14v8"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M8 5h11M8 12h11M8 19h11"/>
      <path d="M4.5 5h.01M4.5 12h.01M4.5 19h.01"/>
      <path d="m12 8.8 1.6 1.6 3.1-3.2M12 15.8l1.6 1.6 3.1-3.2"/>
    </symbol>
    <symbol id="icon-truck" viewBox="0 0 24 24">
      <path d="M3.5 6.5h10v10h-10zM13.5 10h3l3 3v3.5h-6z"/>
      <circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/>
      <path d="M4.5 5.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6M4.5 11.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19 13.2v-2.4l-2-.7-.6-1.5 1-1.9-1.7-1.7-1.9 1-1.5-.6-.7-2H9.2l-.7 2-1.5.6-1.9-1-1.7 1.7 1 1.9-.6 1.5-2 .7v2.4l2 .7.6 1.5-1 1.9 1.7 1.7 1.9-1 1.5.6.7 2h2.4l.7-2 1.5-.6 1.9 1 1.7-1.7-1-1.9.6-1.5z"/>
    </symbol>    <symbol id="icon-order" viewBox="0 0 24 24">
      <path d="M7 4.5h10a2 2 0 0 1 2 2v13H5v-13a2 2 0 0 1 2-2Z"/>
      <path d="M9 4V2.8h6V4M8.5 9h7M8.5 13h7M8.5 17h4"/>
      <path d="M15.5 17h2"/>
    </symbol>
    <symbol id="icon-demand" viewBox="0 0 24 24">
      <path d="M7 3.5h7l4 4v13H7z"/>
      <path d="M14 3.5v4h4M9.5 12h5M9.5 15.5h5"/>
      <path d="M3.5 7.5v11a2 2 0 0 0 2 2H16"/>
    </symbol>
    <symbol id="icon-contract" viewBox="0 0 24 24">
      <path d="M6 3.5h12v17H6z"/>
      <path d="M9 3.5v3h6v-3M9 11h6M9 15h3.5"/>
      <path d="m14.5 16 1.4 1.4 2.8-3"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24">
      <rect x="3.5" y="4" width="17" height="16" rx="2"/>
      <path d="M9 4v16M6 9h.01M6 13h.01"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 7v5h-5M4 17v-5h5"/>
      <path d="M18.2 9A7 7 0 0 0 6.5 6.3L4 9m2 6a7 7 0 0 0 11.5 2.7L20 15"/>
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path d="M14 4h6v6M20 4l-9 9"/>
      <path d="M18 13v6H5V6h6"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="m15.4 15.4 4.1 4.1"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 8.5h17C20.5 16 18 16 18 9Z"/>
      <path d="M9.5 20h5"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="物流控制塔导航">
      <div class="brand-row">
        <a class="brand" href="#customer-order" aria-label="物流控制塔首页">
          <span class="brand-mark"><svg><use href="#icon-oms-logo"/></svg></span>
          <span class="brand-copy">
            <strong>物流控制塔</strong>
            <small>Logistics Workbench</small>
          </span>
        </a>
      </div>

      <nav class="main-nav" aria-label="业务页面">
        <div class="nav-group-title">
          <span class="nav-icon"><svg><use href="#icon-order"/></svg></span>
          <span>物流订单管理</span>
        </div>

        <a class="nav-entry" href="#customer-order" data-page="customer-order" title="客户订单跟踪">
          <span class="nav-icon"><svg><use href="#icon-order"/></svg></span>
          <span class="nav-text">客户订单跟踪</span>
        </a>

        <div class="nav-group" data-nav-group="logistics-demand">
          <button class="nav-entry nav-parent" id="demandMenuToggle" type="button" aria-expanded="false" aria-controls="demandSubmenu" title="物流需求工作台">
            <span class="nav-icon"><svg><use href="#icon-demand"/></svg></span>
            <span class="nav-text">物流需求工作台</span>
            <svg class="nav-chevron"><use href="#icon-chevron"/></svg>
          </button>
          <div class="nav-children" id="demandSubmenu">
            <a class="nav-child" href="#logistics-demand" data-page="logistics-demand" title="物流需求列表">
              <span class="nav-icon"><svg><use href="#icon-list"/></svg></span>
              <span class="nav-text">物流需求列表</span>
            </a>
          </div>
        </div>

        <a class="nav-entry" href="#trade-contract" data-page="trade-contract" title="贸易合同待办">
          <span class="nav-icon"><svg><use href="#icon-contract"/></svg></span>
          <span class="nav-text">贸易合同待办</span>
        </a>

        <div class="nav-entry nav-disabled" aria-disabled="true" title="后续页面，暂未接入">
          <span class="nav-icon"><svg><use href="#icon-demand"/></svg></span>
          <span class="nav-text">物流委托列表</span>
          <span class="nav-tag">待接入</span>
        </div>

        <div class="nav-separator"></div>
        <div class="nav-group-title nav-muted"><span class="nav-icon"><svg><use href="#icon-truck"/></svg></span><span>运输工作台</span></div>
        <div class="nav-group-title nav-muted"><span class="nav-icon"><svg><use href="#icon-database"/></svg></span><span>物流资源池</span></div>
        <div class="nav-group-title nav-muted"><span class="nav-icon"><svg><use href="#icon-settings"/></svg></span><span>OMS配置管理</span></div>
      </nav>

      <div class="sidebar-bottom">
        <button class="sidebar-action" id="prototypeInfo" type="button">原型说明</button>
        <div class="sidebar-version">Prototype v1.1</div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="breadcrumb-wrap">
          <div class="breadcrumb"><span>物流控制塔</span><span class="crumb-separator">/</span><strong id="pageTitle">客户订单跟踪</strong></div>
          <p id="pageDescription">客户订单、物流供应商与履约状态总览</p>
        </div>
        <div class="topbar-actions">
          <span class="prototype-pill"><span></span>交互原型</span>
          <button class="icon-button" id="refreshPage" type="button" title="刷新当前页面" aria-label="刷新当前页面">
            <svg><use href="#icon-refresh"/></svg>
          </button>
          <a class="icon-button" id="openStandalone" href="pages/customer-order-tracking.html" target="_blank" rel="noopener" title="在新窗口打开当前页面" aria-label="在新窗口打开当前页面">
            <svg><use href="#icon-external"/></svg>
          </a>
          <span class="topbar-divider"></span>
          <div class="user-chip" title="当前演示用户">
            <span class="avatar">鲤</span>
            <span class="user-copy"><strong>鲤鱼旗</strong><small>物流运营</small></span>
          </div>
        </div>
      </header>

      <div class="page-stage">
        <iframe class="page-frame" data-page="customer-order" src="pages/customer-order-tracking.html?embed=1" title="客户订单跟踪"></iframe>
        <iframe class="page-frame" data-page="logistics-demand" src="pages/logistics-demand.html?embed=1" title="物流需求工作台"></iframe>
        <iframe class="page-frame" data-page="trade-contract" src="pages/trade-contract-todo.html?embed=1" title="贸易合同待办工作台"></iframe>
        <div class="loading-layer" id="loadingLayer" role="status" aria-live="polite">
          <span class="loading-mark"><i></i><i></i><i></i></span>
          <strong>正在载入业务页面</strong>
          <small>请稍候</small>
        </div>
      </div>
    </section>
  </div>

  <div class="app-toast" id="appToast" role="status" aria-live="polite"></div>\n  <script src="assets/app.js"></script>
</body>
</html>
