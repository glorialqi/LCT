<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流需求单 - 优化版原型</title>
<style>
:root{
  --primary:#0065d9;--primary-hover:#0a73eb;--primary-soft:#e7f1ff;--primary-line:#9fc7f7;
  --page:#edeff2;--white:#fff;--text:#23262e;--muted:#686f80;--muted-2:#9aa1af;
  --line:#e9edf2;--line-dark:#dfe4eb;--field:#f2f3f5;--row:#fafbfc;
  --danger:#e33b3b;--danger-soft:#fff4f4;--warning:#f2a22a;--success:#2da46b;
  --radius:6px;--shadow:0 1px 2px rgba(18,26,42,.025);
  --font:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);background:var(--page);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-width:1280px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c8ccd3;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:stretch;background:#fff;position:relative;z-index:30}
.brand{width:236px;flex:0 0 236px;display:flex;align-items:center;padding:0 12px;background:#fff}
.brand img{display:block;width:168px;height:auto;object-fit:contain}
.hamburger{width:24px;flex:0 0 24px;display:grid;place-items:center;color:#687080}
.hamburger svg{width:16px;height:16px}
.top-tabs{flex:1;display:flex;align-items:center;gap:8px;padding-left:6px;min-width:0;overflow:hidden}
.top-tab{height:33px;padding:0 12px;border:0;border-radius:4px;background:#f2f3f5;color:#555c69;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;transition:.15s}
.top-tab:hover{background:#e9ebef}
.top-tab.active{background:var(--primary-soft);color:var(--primary)}
.tab-close{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;font-size:15px;color:#a2a8b3}
.top-tab.active .tab-close{color:#5f8fce}
.tab-close:hover{background:rgba(0,0,0,.06)}
.top-actions{width:306px;flex:0 0 306px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding-right:24px;color:#6c7382}
.top-icon{position:relative;width:20px;height:20px;display:grid;place-items:center;background:transparent;border:0;color:#707785}
.top-icon svg{width:17px;height:17px}
.badge{position:absolute;right:-6px;top:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#ed4242;color:#fff;font-size:10px;line-height:15px;text-align:center}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:#3f4551;white-space:nowrap}
.avatar{width:18px;height:18px;border-radius:50%;border:1px solid #7c8493;display:grid;place-items:center}
.workspace{flex:1;display:flex;min-height:0}
.sidebar{width:236px;flex:0 0 236px;background:var(--page);overflow-y:auto;overflow-x:hidden;padding:8px 12px 16px;border-right:1px solid rgba(255,255,255,.4)}
.menu-item{height:49px;display:flex;align-items:center;gap:9px;padding:0 6px;border-radius:5px;color:#343943;font-size:14px;white-space:nowrap;user-select:none}
.menu-item:hover{background:rgba(255,255,255,.58)}
.menu-item .ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 18px;color:#3f4652}
.menu-item .ico svg{width:16px;height:16px}
.menu-item .text{flex:1;overflow:hidden;text-overflow:ellipsis}
.menu-item .arrow{color:#9ba2af;font-size:12px;transform:scaleY(.72)}
.menu-group.expanded{background:rgba(255,255,255,.32);border-radius:6px;padding-bottom:4px}
.submenu{padding:0 0 2px 12px}
.subitem{height:40px;display:flex;align-items:center;gap:10px;padding:0 10px 0 22px;border-radius:4px;color:#4f5663;font-size:14px}
.subitem:hover{background:rgba(255,255,255,.72)}
.subitem.active{background:var(--primary-soft);color:var(--primary);font-weight:500;box-shadow:inset 2px 0 0 var(--primary)}
.subitem .ico{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center}
.subitem svg{width:14px;height:14px}
.main{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:var(--page)}
.scroll-area{height:100%;overflow:auto}
.list-scroll{padding:12px 12px 0 8px}
.query-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px}
.query-head{height:48px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.query-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text)}.query-toggle{border:0;padding:0;background:transparent;cursor:pointer;outline:none}.query-toggle:focus-visible{border-radius:3px;box-shadow:0 0 0 2px rgba(37,99,235,.16)}.query-card.query-collapsed .query-body{display:none}.query-card.query-collapsed .query-head{border-bottom-color:transparent}.query-card.query-collapsed .caret{transform:rotate(-90deg)}.query-card.query-collapsed .query-actions [data-filter-toggle]{display:none}
.caret{width:12px;height:12px;display:grid;place-items:center;color:#4d5460;font-size:11px;transition:.15s}
.collapsed .caret{transform:rotate(-90deg)}
.query-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{height:32px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d7dce5;border-radius:6px;background:#fff;color:#424a57;font-size:14px;white-space:nowrap;transition:.15s}
.btn svg{width:14px;height:14px}
.btn:hover:not(:disabled){border-color:var(--primary-line);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn.outline-primary{background:#fff;border-color:var(--primary);color:var(--primary)}
.btn.soft-primary{background:#f5f8ff;border-color:#c8ddff;color:var(--primary)}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-solid:hover:not(:disabled){background:#cf2929;color:#fff}
.btn.mini{height:26px;padding:0 10px;font-size:12px}
.btn.link{border:0;background:transparent;padding:0;height:auto;color:var(--primary);font-size:12px}
.btn.link:hover{color:var(--primary-hover)}
.btn:disabled,.btn.is-disabled{background:#f8f9fb;border-color:#e8ebf0;color:#c5cad3}
.btn.soft-primary:disabled{background:#f3f8ff;border-color:#dbeaff;color:#b7cff1}
.btn.primary:disabled{background:#9fc7f7;border-color:#9fc7f7;color:#fff}
.query-body{padding:10px 20px 8px}
.filter-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 24px}
.filter-field{min-width:0}
.filter-label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;line-height:18px}
.filter-control{height:36px;width:100%;border:1px solid var(--field);border-radius:4px;background:var(--field);padding:0 12px;color:var(--text);outline:none}
.filter-control::placeholder{color:#a8aeb9}
.filter-control:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(0,101,217,.08)}
.filter-more-row{height:16px;display:flex;align-items:center;justify-content:center}
.filter-more{width:24px;height:22px;border:0;background:transparent;color:#a2a8b3;font-size:12px}
.expanded .filter-more svg{transform:rotate(180deg)}
.table-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);min-height:600px;display:flex;flex-direction:column;overflow:hidden}
.status-tabs{height:54px;display:flex;align-items:center;gap:0;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.status-tab{height:54px;min-width:82px;padding:0 16px;border:0;background:transparent;color:#3f4551;font-size:14px;font-weight:700;position:relative;white-space:nowrap}
.status-tab:hover{color:var(--primary)}
.status-tab.active{color:var(--primary)}
.status-tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--primary);border-radius:2px}
.status-spacer{flex:1}
.bulk-actions{display:flex;align-items:center;gap:10px;padding-left:12px;white-space:nowrap}
.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative}
.data-grid{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.data-grid th,.data-grid td{height:54px;border-right:1px solid #edf0f3;border-bottom:1px solid #edf0f3;padding:0 14px;vertical-align:middle;background:#fff}
.data-grid th{height:48px;background:#f8f9fa;color:#4d5461;font-size:12px;font-weight:400;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:4}
.data-grid td{font-size:14px;color:#303641;white-space:nowrap}
.data-grid tbody tr:nth-child(even) td{background:#fafbfc}
.data-grid tbody tr:hover td{background:#f5f9ff}
.data-grid .check-col{width:52px;text-align:center}
.data-grid .action-col{position:sticky;right:0;z-index:3;background:#fff!important;box-shadow:-6px 0 10px rgba(31,40,55,.035)}
.data-grid th.action-col{background:#f8f9fa!important;z-index:5}
.no-cell strong{display:block;font-weight:500;color:#20252d}
.no-cell span{display:block;color:#8f96a3;font-size:12px;margin-top:2px}
.count-grid{display:grid;grid-template-columns:42px 42px;gap:2px 8px;font-size:12px;color:#686f80}
.count-grid b{font-weight:400;margin-left:2px}
.c-blue{color:var(--primary)}.c-orange{color:#f2a22a}.c-red{color:#e75050}.c-muted{color:#9ca3af}
.status-blue{color:var(--primary);font-weight:500}.status-amber{color:#e4a126;font-weight:500}.status-create{color:#64748b;font-weight:500}
.customer-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.action-stack{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.action-stack .btn.link{padding:0;font-size:12px;color:var(--primary)}
.action-stack .btn.link:disabled{color:#aeb7c6}
.pager{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 20px;color:#555d6b;font-size:12px;border-top:1px solid var(--line);background:#fff}
.pager .pages{display:flex;align-items:center;gap:4px}
.page-btn{min-width:28px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:#fff;color:#46505e}
.page-btn.active{border-color:var(--primary);color:var(--primary)}
.pager select,.pager input{height:28px;border:1px solid #e1e5eb;border-radius:4px;background:#fff;padding:0 8px;color:#4f5765}
.pager input{width:42px;text-align:center}
.detail-page{padding:12px 12px 18px 0}
.detail-scroll{height:100%;overflow:auto;padding:0}
.cube-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.detail-titlebar{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;background:#fff}
.detail-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.detail-title .caret{color:#4d5460}
.detail-title .expand-icon{width:20px;height:20px;display:grid;place-items:center;color:#8b929f}
.detail-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.cube-head{height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;background:#fff;border-bottom:0}
.cube-head .title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.cube-head .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.cube-body{padding:0 20px 20px}
.collapse-btn{width:14px;height:20px;display:grid;place-items:center;border:0;background:transparent;padding:0;color:#3e4551}
.collapse-btn svg{width:12px;height:12px;transition:.16s}
.cube-card.is-collapsed .collapse-btn svg{transform:rotate(-90deg)}
.cube-card.is-collapsed .cube-body{display:none}
.grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 24px}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 24px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-6{grid-column:span 6}
.field{display:block;min-width:0}
.field-label{display:flex;align-items:center;gap:2px;margin-bottom:6px;color:var(--muted);font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req{color:#ef4d4d}
.form-control{height:36px;width:100%;border:1px solid var(--field);border-radius:4px;background:var(--field);padding:0 12px;color:var(--text);outline:none;transition:.15s;min-width:0}
textarea.form-control{height:60px;padding:6px 12px;resize:none;line-height:1.55}
.form-control::placeholder{color:#a4abb7}
.form-control:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(0,101,217,.07)}
select.form-control{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8e96a4 50%),linear-gradient(135deg,#8e96a4 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.form-control[disabled],.form-control[readonly],select[disabled]{color:#4d5360;background-color:#f2f3f5;border-color:#f2f3f5;opacity:.74;cursor:default}
.check-line{height:36px;display:flex;align-items:center;gap:8px;color:var(--text)}
.check-line input{width:16px;height:16px;accent-color:var(--primary)}
.check-line.disabled{opacity:.5}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:#f0f3f7;color:#646c7b;font-size:12px;white-space:nowrap}
.tag.blue{background:#e8f3ff;color:#3b84d9}.tag.cyan{background:#e2f4fb;color:#278eb9}.tag.green{background:#eaf7f1;color:#2f9b69}
.customer-layout{display:grid;grid-template-columns:450px minmax(0,1fr);gap:16px;align-items:stretch}
.related-panel,.goods-panel{border:1px solid #e5e9ef;border-radius:6px;min-width:0;overflow:hidden}
.related-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#343a45;font-size:13px;border-bottom:1px solid #edf0f3}
.related-head b{font-weight:400}
.order-summary{margin:6px;border:1px solid #7fb5f3;border-radius:5px;padding:6px 10px;background:#fff;min-height:0;position:relative}
.order-summary .order-top{display:flex;align-items:center;gap:5px;min-width:0}
.order-summary .order-no{font-size:13px;color:#353b45;white-space:nowrap}
.order-summary .tags{margin-left:auto;display:flex;gap:5px;min-width:0;overflow:hidden}
.order-summary .company{margin:4px 0;font-weight:700;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-lines{display:grid;gap:1px;font-size:11px;line-height:1.2;color:#626a77}
.summary-lines .line{display:flex;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-lines b{font-weight:400;color:#555d6a;flex:0 0 auto}
.goods-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #edf0f3;font-size:13px;font-weight:700}
.table-scroll{width:100%;overflow:auto}
.mini-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:940px}
.mini-table th{height:45px;padding:0 12px;background:#f8f9fa;color:#4d5461;font-size:12px;font-weight:400;border-right:1px solid #edf0f3;border-bottom:1px solid #edf0f3;white-space:nowrap}
.mini-table td{height:54px;padding:0 12px;border-right:1px solid #edf0f3;border-bottom:1px solid #edf0f3;background:#fff;color:#333944;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-table tr:nth-child(even) td{background:#fafbfc}
.mini-table .mini-input{height:36px;border:1px solid #f0f1f3;border-radius:4px;background:#f7f8fa;padding:0 10px;width:100%;color:#333944}
.mini-table .danger-link{color:var(--danger)}
.empty-cell{height:96px;text-align:center;color:#9aa1ad}
.upload-box{height:96px;border:1px solid #e1e5eb;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa1af;font-size:12px;background:#fff}
.upload-box b{color:var(--primary);font-weight:400}
.fee-summary{display:flex;gap:22px;align-items:center;height:38px;color:#4d5461;font-size:12px;border-bottom:1px solid #edf0f3}
.fee-table{min-width:1780px}
.fee-table th,.fee-table td{height:54px}
.fee-table .checkbox-cell{width:40px;text-align:center}
.fee-table .mini-input{height:34px}
.section-tabbar{height:56px;display:flex;align-items:center;gap:0;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
.exec-fee-tabs{display:flex;align-items:center;gap:0;height:100%}
.exec-fee-tab{height:100%;padding:0 28px;border:0;background:transparent;color:#4a5260;font-size:14px;position:relative}
.exec-fee-tab.active{color:var(--primary);font-weight:600}
.exec-fee-tab.active:after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:2px;background:var(--primary)}
.exec-fee-block{padding:16px 20px 20px;border-bottom:1px solid var(--line)}
.exec-fee-block:last-child{border-bottom:0}
.exec-fee-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700}
.lower-layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
.tree-card,.entrust-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.tree-card{min-height:860px;display:flex;flex-direction:column;overflow:hidden}
.tree-root{padding:12px 12px 0}
.tree-item{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px;background:var(--primary-soft);color:var(--primary);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-child{margin:8px 0 0 20px;height:42px;border:1px solid #dfe4eb;border-radius:4px;display:flex;align-items:center;gap:6px;padding:0 10px;color:#4c5461;font-size:13px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-footer{margin-top:auto;padding:14px 12px 12px}
.tree-add{height:38px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--primary);font-size:14px;border-top:1px solid var(--line)}
.tree-legend{border-top:1px solid var(--line);padding:10px 14px 14px;font-size:12px;color:#7a8290}
.legend-row{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.entrust-card{min-width:0;overflow:hidden}
.entrust-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.entrust-title{font-size:14px;font-weight:700;white-space:nowrap}
.entrust-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.entrust-body{padding:12px 16px 20px;background:#fff}
.sub-card{border:1px solid #edf0f3;border-radius:6px;margin-bottom:8px;overflow:hidden}
.sub-head{height:52px;display:flex;align-items:center;padding:0 18px;background:#fff}
.sub-head .title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.sub-head .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.sub-body{padding:0 18px 18px}
.task-shell{border:1px solid #e3e8ef;border-radius:6px;margin:2px 0 0;overflow:hidden}
.task-titlebar{height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.task-title{display:flex;align-items:center;gap:8px;font-weight:700;color:#343a45;white-space:nowrap}
.task-actions{margin-left:auto;display:flex;gap:8px}
.task-section{padding:14px 16px 16px;border-bottom:1px solid var(--line)}
.task-section:last-child{border-bottom:0}
.task-section h4{margin:0 0 12px;font-size:14px;font-weight:700;color:#2d333d}
.task-section .grid-6{row-gap:14px}
.task-section .grid-5{row-gap:14px}
.port-block{display:grid;grid-template-columns:1fr;gap:14px}
.section-mini-title{margin:12px 0 10px;font-weight:700;color:#343a45}

.inline-table-wrap{border:1px solid #e5e9ef;border-radius:4px;overflow:auto}

function ledgerNum(value) {

function renderPaymentLedger(isExec) {
  const filter = state.paymentFilter || 'all';

  const statsFor = side => {
    const sideRows = allRows.filter(row => row.side === side);
    return {
      total: sideRows.reduce((sum, row) => sum + ledgerNum(row.amount), 0),
      invoiced: sideRows.reduce((sum, row) => sum + ledgerNum(row.invoiced), 0),
      settled: sideRows.reduce((sum, row) => sum + ledgerNum(row.settled), 0),
      outstanding: sideRows.reduce((sum, row) => sum + ledgerNum(row.outstanding), 0)
    };
  };
  const recvStats = statsFor('recv');
  const payStats = statsFor('pay');
  const showRecv = filter === 'all' || filter === 'recv';
  const showPay = filter === 'all' || filter === 'pay';

  const body = rows.map(row => `<tr data-pay-type="${row.side}">
    <td><div class="doc-statement-line"><button class="doc-number-link" data-doc-open="${row.statementNo}">${row.statementNo}</button><span class="doc-mini-status ${row.statementTone}">${row.statementStatus}</span></div><span class="doc-statement-name">${row.statementName}</span>${row.sourceDoc ? `<span class="doc-cell-sub">关联结算 <button class="doc-number-link" data-doc-open="${row.sourceDoc}">${row.sourceDoc}</button></span>` : ''}</td>
    <td><span class="doc-mini-status ${row.side === 'recv' ? 'info' : 'warning'}">${row.side === 'recv' ? '应收' : '应付'}</span></td>
    <td>${row.statementType}</td>
    <td>${row.party}</td><td>${row.completedAt}</td><td>${row.fee}</td><td>${row.currency}</td>
    <td class="doc-ledger-number">${row.amount}</td><td class="doc-ledger-number">${row.invoiced}</td>
    <td>${renderDocLinkStack(row.invoices)}</td><td class="doc-ledger-number">${row.settled}</td><td class="doc-ledger-number ${ledgerNum(row.outstanding) ? 'is-outstanding' : ''}">${row.outstanding}</td>
    <td>${renderDocLinkStack(row.payments)}</td>
    <td><button class="btn link" data-doc-open="${row.statementNo}">查看对账单</button></td>
  </tr>`).join('');
  return `${filterBar}<div class="doc-ledger-stats ${showRecv && showPay ? '' : 'is-single'}">${showRecv ? statGroup('应收统计', 'recv', recvStats) : ''}${showPay ? statGroup('应付统计', 'pay', payStats) : ''}</div><div class="doc-ledger-meta">${statementCount} 张对账单 · ${rows.length} 条费用行 · 金额单位：CNY</div><div class="doc-all-table-wrap"><table class="mini-table doc-ledger-table"><colgroup><col style="width:180px"><col style="width:82px"><col style="width:104px"><col style="width:185px"><col style="width:110px"><col style="width:90px"><col style="width:64px"><col style="width:105px"><col style="width:105px"><col style="width:230px"><col style="width:115px"><col style="width:115px"><col style="width:230px"><col style="width:100px"></colgroup><thead><tr><th>对账单号</th><th>收付方向</th><th>对账单类型</th><th>结算对象</th><th>对账完成日期</th><th>费目</th><th>币种</th><th>费用金额</th><th>已开票金额</th><th>发票登记</th><th>已收/已付金额</th><th>未收/未付金额</th><th>收款认领 / 付款申请</th><th>操作</th></tr></thead><tbody>${body || '<tr><td colspan="14" class="doc-empty">暂无收付明细</td></tr>'}</tbody></table></div>`;

  const dd=e.target.closest('[data-dropdown]');
  if(dd){const menu=dd.parentElement.querySelector('.dropdown-menu');const open=!menu.classList.contains('open');document.querySelectorAll('.dropdown-menu.open').forEach(m=>m.classList.remove('open'));menu.classList.toggle('open',open);return;}
  if(!e.target.closest('.dropdown-wrap'))document.querySelectorAll('.dropdown-menu.open').forEach(m=>m.classList.remove('open'));
  const tip=e.target.closest('[data-toast]');
  if(tip){toast(tip.dataset.toast);return;}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-row-check]')){
    const id=e.target.dataset.rowCheck;
    if(e.target.checked)state.selectedRows.add(id);else state.selectedRows.delete(id);
    render();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.dropdown-menu.open').forEach(m=>m.classList.remove('open'));
});
window.addEventListener('message',event=>{
  const data=event.data;
  if(!data||data.type!=='ct-navigate')return;
  if(data.view==='list'){
    state.page='list';
    state.detailView='info';
    state.detailSection='overview';
    state.selectedRows.clear();
    render();
  }
});

document.addEventListener('dblclick',event=>{
  if(state.page!=='list')return;
  const row=event.target.closest('tr[data-row-id]');
  if(!row||event.target.closest('button,input,a,select,textarea,label'))return;
  const record=listRows.find(item=>item.no===row.dataset.rowId);
  state.activeRowId=row.dataset.rowId;
  state.page=record&&record.cat==='create'?'create':'exec';
  state.detailView='info';
  state.detailSection='overview';
  state.selectedRows.clear();
  render();
});
render();
</script>
  <script src="../assets/component-system.js"></script>
</body>
</html>
